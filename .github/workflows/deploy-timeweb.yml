name: Deploy Fetique site to Timeweb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

env:
  DEPLOY_HOST: 31.130.144.66
  DEPLOY_USER: fetique-deploy
  DEPLOY_HOST_KEY: "31.130.144.66 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPMBtMeFA8keILRUHQRAjaU5F4dp3Ki2Wkl+2TbLDk7E"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify production build
        shell: bash
        run: |
          grep -qE 'src="/assets/|href="/assets/' dist/index.html
          if grep -qE 'src="\./assets/|href="\./assets/' dist/index.html; then
            echo "ERROR: relative ./assets/ left in dist/index.html — postbuild rewrite failed"
            exit 1
          fi
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "ERROR: dist/index.html still references dev entry — build failed"
            exit 1
          fi
          test -f dist/yandex_6ce789ef6c3d3a42.html || (echo "ERROR: Yandex verification file missing from dist" && exit 1)
          grep -q 'Verification: 6ce789ef6c3d3a42' dist/yandex_6ce789ef6c3d3a42.html
          test -f dist/robots.txt || (echo "ERROR: robots.txt missing from dist" && exit 1)
          grep -q 'Sitemap: https://fetique.com/sitemap.xml' dist/robots.txt
          if grep -qiE '^Host:' dist/robots.txt; then
            echo "ERROR: obsolete Host directive in robots.txt — remove it for Yandex Webmaster"
            exit 1
          fi
          test -f dist/sitemap.xml || (echo "ERROR: sitemap.xml missing from dist" && exit 1)
          test -f dist/privacy/index.html || (echo "ERROR: privacy page missing from dist" && exit 1)

      - name: Upload to Timeweb
        shell: bash
        env:
          DEPLOY_KEY_B64: ${{ secrets.TIMEWEB_DEPLOY_KEY_B64 }}
        run: |
          if [ -z "$DEPLOY_KEY_B64" ]; then
            echo "ERROR: repository secret TIMEWEB_DEPLOY_KEY_B64 is empty or missing"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          if ! printf '%s' "$DEPLOY_KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null; then
            echo "ERROR: TIMEWEB_DEPLOY_KEY_B64 is not valid base64 (length ${#DEPLOY_KEY_B64})"
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub; then
            echo "ERROR: decoded secret is not a private key; first line: $(head -c 40 ~/.ssh/deploy_key | head -1)"
            exit 1
          fi
          # Ожидается SHA256:q8SEo9hPtL3IdlpXaF7a1JS1ETiexWm223Rhn5lGgAo (fetique-site-deploy)
          ssh-keygen -lf ~/.ssh/deploy_key.pub
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # Ключ на сервере ограничен rrsync каталогом /var/www/fetique: путь "./" — это его корень.
          rsync -rlptz --delete --chmod=D755,F644 \
            --exclude CNAME --exclude .nojekyll \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:./"
