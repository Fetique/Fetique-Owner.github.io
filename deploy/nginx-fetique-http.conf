# Этап 1: до выпуска сертификата. Только HTTP, только fetique.com / www.fetique.com.
server {
    listen 80;
    listen [::]:80;
    server_name fetique.com www.fetique.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fetique-acme;
        default_type text/plain;
    }

    root /var/www/fetique;
    index index.html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
