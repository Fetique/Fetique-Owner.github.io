# Этап 2: после выпуска сертификата fetique.com (certbot certonly --webroot).
# Без http2: в nginx 1.24 он включается на весь сокет :443, то есть и для Pulse.
server {
    listen 80;
    listen [::]:80;
    server_name fetique.com www.fetique.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fetique-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://fetique.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fetique.com www.fetique.com;

    ssl_certificate /etc/letsencrypt/live/fetique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fetique.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.fetique.com) {
        return 301 https://fetique.com$request_uri;
    }

    root /var/www/fetique;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
